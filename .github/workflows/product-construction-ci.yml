name: Product Construction CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-construction-ci.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - shared/**
  pull_request:
    paths:
      - .github/workflows/product-construction-ci.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - shared/**
  workflow_dispatch:

concurrency:
  group: product-construction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-jvm-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean-room Product repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Compile Android/JVM shared core and run common contracts on JVM
        run: gradle --no-daemon --stacktrace :shared:build :shared:jvmTest

  android-keystore-device:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean-room Product repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Provision Android emulator from Google SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ ! -x "$AVDMANAGER" ]; then AVDMANAGER="$(command -v avdmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-35;google_apis;x86_64" >/dev/null
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$ADB"
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name appfusion-secureblob-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6 >/dev/null
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/appfusion-avds.txt"
          grep -qx 'appfusion-secureblob-api35' "$RUNNER_TEMP/appfusion-avds.txt"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd appfusion-secureblob-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/appfusion-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          device_ready=0
          for _ in $(seq 1 90); do
            if "$ADB" get-state 2>/dev/null | grep -qx device; then
              device_ready=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android emulator process exited before ADB became ready.' >&2
              cat "$RUNNER_TEMP/appfusion-emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$device_ready" != "1" ]; then
            echo 'Android emulator did not become ADB-ready within 180 seconds.' >&2
            cat "$RUNNER_TEMP/appfusion-emulator.log" >&2 || true
            exit 1
          fi
          booted=0
          for _ in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Android emulator process exited before boot completed.' >&2
              cat "$RUNNER_TEMP/appfusion-emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            echo 'Android emulator did not complete boot within 240 seconds.' >&2
            cat "$RUNNER_TEMP/appfusion-emulator.log" >&2 || true
            exit 1
          fi
          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
      - name: Run Android Keystore device probe
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: gradle --no-daemon --stacktrace :shared:connectedAndroidTest
      - name: Emit Android failure evidence
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/appfusion-emulator.log" || true
          find shared/build -type f -name 'TEST-*.xml' -print -exec cat {} \; || true
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true

  ios-contracts:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out clean-room Product repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
      - name: Run shared contracts and link iOS Simulator framework
        run: >-
          gradle --no-daemon --stacktrace
          :shared:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Run Apple Keychain adapter from simulator-installed host app
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_DIR="$PWD/shared/build/bin/iosSimulatorArm64/debugFramework"
          FRAMEWORK="$FRAMEWORK_DIR/AppFusionShared.framework"
          test -d "$FRAMEWORK"
          grep -n 'AppleKeychainHostProbe' "$FRAMEWORK/Headers/AppFusionShared.h"

          APP="$RUNNER_TEMP/SecureBlobProbe.app"
          SWIFT="$RUNNER_TEMP/SecureBlobProbe.swift"
          mkdir -p "$APP/Frameworks"
          cat >"$SWIFT" <<'SWIFT'
          import Foundation
          import AppFusionShared

          @main
          struct SecureBlobProbeMain {
              static func main() {
                  let result = AppleKeychainHostProbe().runProbe()
                  print("APPFUSION_KEYCHAIN_PROBE=\(result)")
              }
          }
          SWIFT
          cat >"$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>SecureBlobProbe</string>
            <key>CFBundleIdentifier</key><string>com.appfusion.secureblob.probe</string>
            <key>CFBundleName</key><string>SecureBlobProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          PLIST
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc \
            -parse-as-library \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0-simulator \
            -F "$FRAMEWORK_DIR" \
            -framework AppFusionShared \
            -Xlinker -rpath \
            -Xlinker @executable_path/Frameworks \
            -o "$APP/SecureBlobProbe" \
            "$SWIFT"
          cp -R "$FRAMEWORK" "$APP/Frameworks/AppFusionShared.framework"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/AppFusionShared.framework"
          codesign --force --sign - --timestamp=none "$APP"

          RUNTIME="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))
          candidates = [r for r in payload['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not candidates:
              raise SystemExit('No available iOS simulator runtime')
          def ver(r):
              return tuple(int(p) for p in r.get('version','0').split('.'))
          print(max(candidates, key=ver)['identifier'])
          PY
          )"
          DEVICE_TYPES="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))
          ids = [d['identifier'] for d in payload['devicetypes'] if d.get('name','').startswith('iPhone')]
          for identifier in reversed(ids):
              print(identifier)
          PY
          )"
          UDID=''
          while IFS= read -r DEVICE_TYPE; do
            if [ -n "$DEVICE_TYPE" ] && CANDIDATE="$(xcrun simctl create AppFusionSecureBlobProbe "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null)"; then
              UDID="$CANDIDATE"
              break
            fi
          done <<< "$DEVICE_TYPES"
          test -n "$UDID"
          cleanup_simulator() {
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          set +e
          OUTPUT="$(xcrun simctl launch --console "$UDID" com.appfusion.secureblob.probe 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$STATUS" -eq 0
          grep -F 'APPFUSION_KEYCHAIN_PROBE=OK' <<<"$OUTPUT"
      - name: Emit iOS test failure evidence
        if: failure()
        shell: bash
        run: |
          find shared/build/test-results -type f -name '*.xml' -print -exec cat {} \; || true
