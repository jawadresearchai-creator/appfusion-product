name: Product Boundary CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-boundary-ci.yml
      - .github/workflows/product-construction-ci.yml
      - blueprints/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - shared/**
      - environment-manifest.json
      - policies/**
      - schemas/**
      - scripts/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/product-boundary-ci.yml
      - .github/workflows/product-construction-ci.yml
      - blueprints/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - shared/**
      - environment-manifest.json
      - policies/**
      - schemas/**
      - scripts/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: product-boundary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-room-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Product repository only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run clean-room guard tests
        run: python -m unittest discover -s tests -v
      - name: Verify approved blueprint transfers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          blueprints=(blueprints/approved/PRODUCT_BLUEPRINT__*.json)
          attestations=(blueprints/approved/PRODUCT_APPROVAL_ATTESTATION__*.json)
          if (( ${#blueprints[@]} != ${#attestations[@]} )); then
            echo 'Approved blueprint/attestation count mismatch.' >&2
            exit 1
          fi
          for blueprint in "${blueprints[@]}"; do
            base=$(basename "$blueprint")
            suffix=${base#PRODUCT_BLUEPRINT__}
            attestation="blueprints/approved/PRODUCT_APPROVAL_ATTESTATION__${suffix}"
            test -f "$attestation"
            python scripts/verify_transfer.py "$blueprint" "$attestation"
          done
      - name: Reject forbidden artifact types
        shell: bash
        run: |
          if find . -path ./.git -prune -o -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.xapk' -o -iname '*.dex' -o -iname '*.smali' \) -print -quit | grep -q .; then
            echo 'Forbidden Foundry/input artifact detected in Product repository.' >&2
            exit 1
          fi
